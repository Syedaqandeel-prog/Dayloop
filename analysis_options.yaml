analyzer:
  errors:
    # From Flutter 3.47 onward `package:flutter/material.dart` shows a
    # deprecation note in favour of `package:material_ui`. We keep
    # material.dart on purpose so the app builds on both older and newer
    # Flutter versions. Everything else is checked normally.
    deprecated_member_use: ignore
  exclude:
    - build/**
    - web/**
  language:
    strict-casts: true
    strict-raw-types: true
